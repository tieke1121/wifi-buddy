[package]
name = "wifi-buddy"
version = "0.1.0"
description = "给普通人用的跨平台桌面 Wi-Fi 小管家"
authors = ["tieke1121"]
edition = "2024"

[lib]
name = "wifi_buddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
